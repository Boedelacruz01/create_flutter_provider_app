name: noteapp
description: A new Flutter application.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.1.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.2
  provider: ^6.0.0
  shared_preferences: ^2.2.2
  firebase_core: ^3.0.0
  firebase_auth: ^5.6.2
  cloud_firestore: ^5.6.11
  flutter_platform_widgets: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/lang/en.json
    - assets/lang/zh.json # Optional: if you're supporting Chinese
